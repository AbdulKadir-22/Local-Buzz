services:
  mysql:
    image: mysql:8.0
    container_name: lb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: localbuzz_db
    ports:
      - "3309:3306"
    volumes:
      - lb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lb_data:
